<script>
// ══════════════════════════════════════════════════════════════════════════════
// FRIENDS & FAMILY ACCESS
// One invite list, checked in one place. The Netlify function get-family-list is
// the source of truth; the local list below is only a fallback if it can't be
// reached. All AI runs through Netlify Functions on the APEX business key.
// ══════════════════════════════════════════════════════════════════════════════
let SUPABASE_CLIENT = null; // analytics off for the friends & family build

const APEX_FAMILY_LIST_URL = 'https://apex-functions.netlify.app/.netlify/functions/get-family-list';
const APEX_LOCAL_FAMILY = [
  'lv459172@gmail.com',
  '01j.valencia@gmail.com',
  'avalencia@paznaz.org',
  'evalencia@paznaz.org',
  'juliaesanchez27@gmail.com',
  'darkmagykx@gmail.com'
];
const APEX_LOCAL_BETA = ['david.velasco27@yahoo.com'];

function apexAccessEmail(){
  return (localStorage.getItem('apex_access_email') || '').trim().toLowerCase();
}

function isSignedIn(){
  const mode = localStorage.getItem('apex_access_mode');
  return !!apexAccessEmail() && (mode === 'family_indefinite' || mode === 'beta_30day');
}

// Returns { mode: 'family_indefinite' | 'beta_30day' | null, remote: bool }
async function lookupAccess(email){
  email = (email || '').trim().toLowerCase();
  const local = APEX_LOCAL_FAMILY.includes(email) ? 'family_indefinite'
              : APEX_LOCAL_BETA.includes(email)   ? 'beta_30day' : null;
  try {
    const ctrl = new AbortController();
    const timer = setTimeout(function(){ ctrl.abort(); }, 6000);
    const resp = await fetch(APEX_FAMILY_LIST_URL, { signal: ctrl.signal });
    clearTimeout(timer);
    if(resp.ok){
      const data = await resp.json();
      if(data && data.success){
        const fam  = (data.familyEmails || []).map(function(e){ return String(e).trim().toLowerCase(); });
        const beta = (data.betaTesterEmails || []).map(function(e){ return String(e).trim().toLowerCase(); });
        const remote = fam.includes(email) ? 'family_indefinite' : beta.includes(email) ? 'beta_30day' : null;
        return { mode: remote || local, remote: true };
      }
    }
  } catch(e){ /* offline or function down: fall back to local list */ }
  return { mode: local, remote: false };
}

// Re-check the signed-in email in the background. Only signs someone out if the
// live list loaded AND they're on neither list (so an outage never locks family out).
async function refreshAccessInBackground(){
  const email = apexAccessEmail();
  if(!email) return;
  const r = await lookupAccess(email);
  if(r.mode){
    localStorage.setItem('apex_access_mode', r.mode);
  } else if(r.remote){
    localStorage.removeItem('apex_access_email');
    localStorage.removeItem('apex_access_mode');
    location.reload();
  }
}

// Reset AI usage counter daily for trial users
function resetDailyAICounter(){
  const lastReset = localStorage.getItem('apex_ai_uses_last_reset');
  const today = new Date().toDateString();
  if(lastReset !== today){
    localStorage.setItem('apex_ai_uses_trial', '0');
    localStorage.setItem('apex_ai_uses_last_reset', today);
  }
}
window.addEventListener('load', resetDailyAICounter);

// Log session start when page loads
window.addEventListener('load', function(){
  const email = localStorage.getItem('apex_trial_email') || localStorage.getItem('apex_sign_in_email');
  if(email){
    logSessionStart(email);
  }
});

// Log session end when page unloads
window.addEventListener('beforeunload', function(){
  const email = localStorage.getItem('apex_trial_email') || localStorage.getItem('apex_sign_in_email');
  if(email){
    logSessionEnd(email);
  }
});

// Track trial signup in Supabase
async function logTrialSignup(email, deviceFP){
  if(!SUPABASE_CLIENT){
    console.warn('Supabase not ready');
    return;
  }
  try {
    const { error } = await SUPABASE_CLIENT.from('trial_users').insert([{
      email: email,
      device_fingerprint: deviceFP,
      trial_status: 'active'
    }]);
    if(error) console.error('Trial signup error:', error);
    else console.log('✓ Trial signup logged:', email);
  } catch(e){ console.error('Trial signup exception:', e); }
}

// Send verification email (background)
async function sendVerificationEmail(email){
  if(!SUPABASE_CLIENT) return;
  try {
    const token = Math.random().toString(36).substring(2, 15) + Math.random().toString(36).substring(2, 15);
    const expiresAt = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toISOString();
    
    const { error } = await SUPABASE_CLIENT.from('email_tokens').insert([{
      email: email,
      token: token,
      expires_at: expiresAt
    }]);
    if(error) console.error('Email token error:', error);
    else console.log('✓ Verification token created:', email);
  } catch(e){ console.error('Email token exception:', e); }
}

// ── NEW: Log API Usage (plan generation, coaching, etc.) ──
async function logAPIUsage(email, eventType, tokensUsed){
  if(!SUPABASE_CLIENT || !email) return;
  try {
    // Estimate cost: Claude Sonnet ~$3 per 1M input tokens
    const costUSD = (tokensUsed / 1000000) * 3;
    
    const { error } = await SUPABASE_CLIENT.from('api_usage').insert([{
      email: email,
      event_type: eventType,
      tokens_used: tokensUsed,
      cost_usd: parseFloat(costUSD.toFixed(4))
    }]);
    if(error) console.error('API usage log error:', error);
    else console.log('✓ API usage logged:', email, eventType, 'tokens:', tokensUsed, 'cost:', costUSD.toFixed(4));
  } catch(e){ console.error('API usage exception:', e); }
}

// ── NEW: Log User Engagement (sessions, features, duration) ──
async function logEngagement(email, eventType, featureName, durationSeconds){
  // Engagement logging disabled - Supabase endpoints not available on Netlify
  // This is optional analytics, not critical to APEX functionality
  return;
}

// ── NEW: Log Session Start ──
async function logSessionStart(email){
  if(!SUPABASE_CLIENT || !email) return;
  sessionStorage.setItem('apex_session_start', Date.now().toString());
  await logEngagement(email, 'session_start', null, null);
}

// ── NEW: Log Session End ──
async function logSessionEnd(email){
  if(!SUPABASE_CLIENT || !email) return;
  const startTime = parseInt(sessionStorage.getItem('apex_session_start') || '0');
  const durationSeconds = Math.floor((Date.now() - startTime) / 1000);
  await logEngagement(email, 'session_end', null, durationSeconds);
  sessionStorage.removeItem('apex_session_start');
}

// ── NEW: Log Feature Usage ──
async function logFeatureUsed(email, featureName){
  if(!SUPABASE_CLIENT || !email) return;
  await logEngagement(email, 'feature_used', featureName, null);
}

// Track conversion (trial → paid)
async function logConversion(email, purchaseType, deviceFP){
  if(!SUPABASE_CLIENT) return;
  try {
    // Update trial_users status
    await SUPABASE_CLIENT
      .from('trial_users')
      .update({ trial_status: 'converted', converted_at: new Date().toISOString() })
      .eq('email', email);
    
    // Log analytics event
    await SUPABASE_CLIENT
      .from('trial_analytics')
      .insert([{
        email: email,
        event_type: 'converted_' + purchaseType,
        device_fingerprint: deviceFP,
        purchase_type: purchaseType
      }]);
  } catch(e){ console.warn('Conversion log error:', e); }
}

// Verify email token
async function verifyEmailToken(email, token){
  if(!SUPABASE_CLIENT) return false;
  try {
    const { data, error } = await SUPABASE_CLIENT
      .from('email_tokens')
      .update({ used_at: new Date().toISOString() })
      .eq('email', email)
      .eq('token', token)
      .select();
    
    if(!error && data && data.length > 0){
      await SUPABASE_CLIENT
        .from('trial_users')
        .update({ email_verified: true, verified_at: new Date().toISOString() })
        .eq('email', email);
      return true;
    }
  } catch(e){ console.warn('Email verification error:', e); }
  return false;
}
</script>

.sum-card h3{font-family:'Bebas Neue';font-size:16px;letter-spacing:3px;color:var(--goal-hi);
  margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid rgba(245,238,216,.08)}
.sum-row{display:flex;justify-content:space-between;align-items:center;
  padding:9px 0;border-bottom:1px solid rgba(245,238,216,.05);font-size:10px}
.sum-row:last-child{border-bottom:none}
.sum-day{color:var(--text);font-weight:700;text-transform:uppercase;letter-spacing:.5px;font-size:10px}
.sum-day span{display:block;font-size:9px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0;margin-top:1px}
.sum-st{font-size:9px;font-weight:700;padding:3px 8px;border-radius:3px;letter-spacing:1px;text-transform:uppercase}
.sum-st.done{background:rgba(22,101,52,.4);color:#4ade80;border:1px solid rgba(74,222,128,.25)}
.sum-st.partial{background:rgba(120,53,15,.4);color:var(--amber);border:1px solid rgba(244,135,75,.25)}
.sum-st.none{background:rgba(245,238,216,.05);color:var(--muted);border:1px solid rgba(245,238,216,.1)}
.reflect-inp{width:100%;background:rgba(245,238,216,.04);border:1.5px solid rgba(245,238,216,.1);
  border-radius:6px;padding:10px;font-family:'Space Mono';font-size:11px;color:var(--text);
  resize:none;outline:none;min-height:64px;margin-top:8px;transition:border-color .2s}
.reflect-inp::placeholder{color:rgba(245,238,216,.22)}
.reflect-inp:focus{border-color:var(--goal-acc)}

/* ── BODY MAP — redesigned ── */







/* Body figure display */




/* Muscle heatmap legend */

.legend-item{display:flex;align-items:center;gap:6px;font-size:9px;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px}
.legend-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}

/* Muscle radar / stats grid */

.muscle-card{background:rgba(245,238,216,.04);border:1.5px solid rgba(245,238,216,.1);
  border-radius:10px;padding:14px;transition:border-color .2s,transform .2s var(--ease-spring)}
.muscle-card:active{transform:scale(0.97)}
.mc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:8px}
.mc-name{font-family:'Bebas Neue';font-size:13px;letter-spacing:1.5px;color:var(--text)}
.mc-badge{font-size:8px;font-weight:700;padding:2px 6px;border-radius:3px;
  letter-spacing:.5px;text-transform:uppercase}
.mc-level-num{font-family:'Bebas Neue';font-size:34px;letter-spacing:1px;line-height:1;margin-bottom:2px}
.mc-status{font-size:9px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
.mc-sets-lbl{font-size:9px;color:var(--muted);margin-top:4px}
.mc-bar-bg{background:rgba(245,238,216,.1);border-radius:3px;height:4px;margin-top:8px;overflow:hidden}
.mc-bar-fill{height:100%;border-radius:3px;transition:width .6s var(--ease-out-quart)}
.mc-decay{font-size:9px;color:var(--amber);margin-top:6px;display:flex;align-items:center;gap:4px}

/* Glute breakdown */



.glute-card{background:rgba(245,238,216,.04);border:1px solid rgba(245,238,216,.08);
  border-radius:8px;padding:12px}
.gc-name{font-family:'Space Mono';font-size:9px;font-weight:700;color:var(--muted);
  text-transform:uppercase;letter-spacing:.5px;margin-bottom:2px}
.gc-desc{font-size:9px;color:rgba(245,238,216,.35);line-height:1.4;margin-bottom:6px}
.gc-level{font-family:'Bebas Neue';font-size:24px;letter-spacing:1px;line-height:1}
.gc-bar-bg{background:rgba(245,238,216,.1);border-radius:2px;height:3px;margin-top:6px;overflow:hidden}
.gc-bar-fill{height:100%;border-radius:2px;transition:width .5s var(--ease-out-quart)}

.muscle-section-title{font-family:'Bebas Neue';font-size:15px;letter-spacing:3px;
  color:var(--goal-hi);margin:16px 0 10px;padding-bottom:6px;
  border-bottom:1px solid rgba(245,238,216,.08)}

/* RESOURCES */
.res-source{background:rgba(245,238,216,.04);border:1.5px solid rgba(245,238,216,.1);
  border-radius:8px;padding:14px;margin-bottom:8px;display:flex;align-items:flex-start;gap:10px;
  transition:border-color .2s,transform .15s var(--ease-spring)}
.res-source:active{transform:scale(0.99)}
.res-icon{font-size:18px;flex-shrink:0;margin-top:2px}
.res-source a{font-family:'Space Mono';font-size:11px;font-weight:700;color:var(--goal-hi);text-decoration:none}
.res-source a.ml{color:var(--mtn-hi)}
.res-source span{font-size:10px;color:var(--muted);display:block;margin-top:3px;line-height:1.5}
.res-sec-title{font-family:'Bebas Neue';font-size:15px;letter-spacing:3px;color:var(--goal-hi);
  margin:14px 0 8px;padding-bottom:5px;border-bottom:1px solid rgba(245,238,216,.08)}
.res-ex-block{margin-bottom:12px;padding-bottom:12px;border-bottom:1px solid rgba(245,238,216,.06)}
.res-ex-name{font-size:11px;font-weight:700;color:var(--text);margin-bottom:6px}

/* PAGE TITLES */
.page-title{font-family:'Bebas Neue';font-size:28px;letter-spacing:5px;color:var(--text);padding:14px 14px 3px}
.page-sub{font-size:9px;color:var(--muted);letter-spacing:1px;padding:0 14px 12px;text-transform:uppercase}

/* BOTTOM NAV */
.bnav{position:fixed;bottom:0;left:0;right:0;background:var(--black);
  border-top:2px solid var(--goal-acc);display:flex;z-index:300;
  padding-bottom:env(safe-area-inset-bottom);
  transition:border-color 0.4s var(--ease-out-quart)}
.nav-btn{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  padding:10px 4px;border:none;background:none;cursor:pointer;color:rgba(245,238,216,.35);
  font-family:'Space Mono';font-size:8px;font-weight:700;letter-spacing:1px;text-transform:uppercase;
  transition:color .2s,transform .15s var(--ease-spring);user-select:none}
.nav-btn:active{transform:scale(0.9)}
.nav-btn.active{color:var(--goal-hi)}
.nav-icon{font-size:18px;line-height:1}

/* AI MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.93);z-index:500;
  display:flex;align-items:center;justify-content:center;padding:20px;
  opacity:0;pointer-events:none;transition:opacity .25s}
.modal-overlay.open{opacity:1;pointer-events:all}
.modal-box{background:var(--goal-bg);border:1.5px solid var(--goal-acc);border-radius:12px;
  padding:0;width:100%;max-width:480px;position:relative;text-align:center;
  transform:translateY(20px) scale(0.97);transition:transform .3s var(--ease-spring);
  display:flex;flex-direction:column;max-height:88vh}
.modal-overlay.open .modal-box{transform:translateY(0) scale(1)}
.modal-body{padding:28px 22px 0;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}
.modal-footer{padding:14px 22px 20px;border-top:1px solid rgba(245,238,216,.08);
  background:var(--goal-bg);flex-shrink:0;border-radius:0 0 12px 12px}
.modal-footer .modal-btn{margin-bottom:0}
.modal-close{position:absolute;top:12px;right:14px;background:none;border:none;
  color:var(--muted);font-size:22px;cursor:pointer;line-height:1;
  transition:color .2s,transform .15s var(--ease-spring)}
.modal-close:active{transform:scale(0.85)}
.modal-title{font-family:'Bebas Neue';font-size:26px;letter-spacing:4px;color:var(--goal-acc);margin-bottom:3px}
.modal-powered{font-size:9px;color:var(--muted);letter-spacing:1px;text-transform:uppercase;margin-bottom:16px}
.modal-textarea{width:100%;background:rgba(245,238,216,.07);border:1.5px solid rgba(245,238,216,.2);
  border-radius:8px;padding:13px 14px;font-family:'Space Mono',monospace;font-size:11px;
  color:var(--text);outline:none;margin-bottom:6px;resize:none;line-height:1.65;
  transition:border-color .2s}
.modal-textarea:focus{border-color:var(--goal-acc)}
.modal-textarea::placeholder{color:rgba(245,238,216,.22);font-size:10px;line-height:1.75}
.modal-hint{font-size:9px;color:var(--muted);letter-spacing:.5px;margin-bottom:14px;text-transform:uppercase;text-align:left}
.modal-btn{width:100%;padding:14px;background:var(--goal-acc);border:none;border-radius:8px;
  font-family:'Bebas Neue';font-size:20px;letter-spacing:2px;color:var(--text);cursor:pointer;
  transition:all .2s var(--ease-spring)}
.modal-btn:active{transform:scale(0.97);opacity:.9}
.modal-btn:disabled{opacity:.5;cursor:not-allowed}
.confirm-warning{background:rgba(244,135,75,.1);border:1px solid rgba(244,135,75,.3);
  border-radius:6px;padding:8px 10px;font-size:10px;color:var(--amber);
  margin-bottom:10px;line-height:1.5;text-align:left}
/* Serve instructions */
.serve-option{display:flex;gap:10px;align-items:flex-start;background:rgba(245,238,216,.04);
  border:1px solid rgba(245,238,216,.1);border-radius:8px;padding:10px 12px;
  margin-bottom:8px;text-align:left}
.serve-num{font-family:'Bebas Neue';font-size:20px;color:var(--goal-acc);line-height:1;
  flex-shrink:0;width:20px}
.serve-title{font-size:11px;font-weight:700;color:var(--text);margin-bottom:3px}
.serve-desc{font-size:10px;color:var(--muted);line-height:1.5}
/* Confirm stage */
.confirm-icon{font-size:28px;margin:4px 0 4px}
.confirm-title{font-family:'Bebas Neue';font-size:18px;letter-spacing:3px;color:var(--goal-acc);margin-bottom:12px}
.confirm-card{background:rgba(245,238,216,.05);border:1.5px solid rgba(245,238,216,.12);
  border-radius:10px;padding:14px;text-align:left;margin-bottom:12px}
.confirm-row{display:flex;gap:10px;align-items:flex-start;padding:6px 0;
  border-bottom:1px solid rgba(245,238,216,.07)}
.confirm-row:last-child{border-bottom:none;padding-bottom:0}
.confirm-label{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;
  min-width:66px;padding-top:2px;flex-shrink:0}
.confirm-value{font-size:11px;color:var(--text);line-height:1.5;font-weight:700}
.confirm-value.sub{font-weight:400;color:rgba(245,238,216,.7)}
.confirm-tag{display:inline-block;background:var(--goal-acc);color:var(--text);
  font-size:8px;font-weight:700;padding:2px 7px;border-radius:3px;
  letter-spacing:.5px;text-transform:uppercase;margin:2px 3px 2px 0}
.confirm-edit-wrap{display:flex;align-items:center;justify-content:center;gap:8px;margin-bottom:12px}
.confirm-edit-label{font-size:10px;color:var(--muted)}
.confirm-edit-btn{background:none;border:1px solid rgba(245,238,216,.2);border-radius:4px;
  padding:5px 10px;font-family:'Space Mono',monospace;font-size:9px;color:var(--muted);
  cursor:pointer;letter-spacing:.5px;text-transform:uppercase;transition:all .2s}
.confirm-edit-btn:hover{color:var(--text);border-color:rgba(245,238,216,.4)}
.confirm-edit-btn:active{transform:scale(0.95)}
.parse-spinner{display:inline-block;width:13px;height:13px;border:2px solid rgba(245,238,216,.15);
  border-top-color:var(--text);border-radius:50%;animation:spin .7s linear infinite;
  margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
.modal-loading-txt{font-family:'Bebas Neue';font-size:18px;letter-spacing:2px;
  color:var(--goal-acc);margin:20px 0 6px;animation:pulse 1.5s infinite}
.modal-loading-sub{font-size:10px;color:var(--muted);letter-spacing:1px}
.modal-success-txt{font-family:'Bebas Neue';font-size:20px;letter-spacing:2px;color:#4ade80;margin:12px 0 6px}
.modal-error-txt{font-size:11px;color:var(--red);margin:12px 0;line-height:1.5}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes dotPulse{0%,80%,100%{transform:scale(0.6);opacity:0.4}40%{transform:scale(1);opacity:1}}
@keyframes fadeSlideIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.hidden{display:none!important}
.anim-in{animation:fadeSlideIn .3s var(--ease-out-quart)}

/* PWA INSTALL BANNER */
.install-banner{background:rgba(212,82,10,.12);border:1px solid rgba(212,82,10,.3);
  border-radius:8px;margin:10px 14px;padding:12px 14px;display:flex;align-items:center;gap:10px}
.install-banner-text{flex:1;font-size:10px;color:var(--text);line-height:1.5}
.install-banner-text strong{font-size:11px;display:block;margin-bottom:2px;color:var(--goal-hi)}
.install-btn{background:var(--goal-acc);border:none;border-radius:6px;padding:8px 14px;
  font-family:'Space Mono';font-size:9px;font-weight:700;color:var(--text);cursor:pointer;
  white-space:nowrap;letter-spacing:.5px;transition:all .2s var(--ease-spring)}
.install-btn:active{transform:scale(0.94)}
.banner-close{background:none;border:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 4px}

/* ── THEME PAGE ─────────────────────────────────────────────────────────────── */
.theme-page{padding:14px}
.theme-section-title{font-family:'Bebas Neue',cursive;font-size:13px;letter-spacing:3px;
  color:var(--muted);text-transform:uppercase;margin:20px 0 10px;
  padding-bottom:6px;border-bottom:1px solid rgba(245,238,216,.08)}
.theme-cards{display:flex;flex-direction:column;gap:10px}
.theme-card{border-radius:10px;border:2px solid rgba(245,238,216,.1);
  padding:16px;cursor:pointer;transition:all .25s var(--ease-out-quart);
  display:flex;align-items:center;gap:14px;user-select:none;position:relative;overflow:hidden}
.theme-card:active{transform:scale(0.98)}
.theme-card.selected{border-color:var(--goal-acc)}
.theme-card.selected::after{content:'✓';position:absolute;top:12px;right:14px;
  font-size:14px;font-weight:700;color:var(--goal-acc)}
.theme-swatch{width:44px;height:44px;border-radius:8px;flex-shrink:0;

.theme-info{flex:1;min-width:0}
.theme-name{font-family:'Bebas Neue',cursive;font-size:17px;letter-spacing:2px;
  color:var(--text);line-height:1.1;margin-bottom:3px}
.theme-desc{font-size:10px;color:var(--muted);line-height:1.5}
.theme-palette{display:flex;gap:4px;margin-top:8px}
.theme-dot{width:12px;height:12px;border-radius:50%;border:1px solid rgba(255,255,255,.1)}

/* Metal theme overrides — applied to html[data-theme=metal] */
html[data-theme="metal"] body{font-family:'Space Mono',monospace}
html[data-theme="metal"] .hd-info h1{font-family:var(--font-metal);letter-spacing:3px;font-size:13px}

html[data-theme="metal"] .dname{font-family:var(--font-metal);letter-spacing:6px}

html[data-theme="metal"] .page-title{font-family:var(--font-metal);letter-spacing:6px}
html[data-theme="metal"] .modal-title{font-family:var(--font-metal);letter-spacing:4px}
html[data-theme="metal"] .stat-num{font-family:var(--font-metal)}
html[data-theme="metal"] .mc-level-num{font-family:var(--font-metal)}
html[data-theme="metal"] .wbtn{font-family:var(--font-metal);letter-spacing:2px}
html[data-theme="metal"] .dtab{font-family:var(--font-metal);font-size:10px}

html[data-theme="metal"] .pb-bg{height:6px;border-radius:0}
html[data-theme="metal"] .pb-fill{border-radius:0}

html[data-theme="metal"] .nav-btn{font-family:var(--font-metal);font-size:9px;letter-spacing:1px}
html[data-theme="metal"] .confirm-title{font-family:var(--font-metal)}
html[data-theme="metal"] .modal-success-txt{font-family:var(--font-metal)}
html[data-theme="metal"] .modal-loading-txt{font-family:var(--font-metal)}

/* ── API KEY ONBOARDING ──────────────────────────────────────────────────── */
.key-gate{position:fixed;inset:0;background:var(--goal-bg);z-index:900;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:32px 24px;text-align:center}
.key-gate.hidden{pointer-events:none!important;visibility:hidden!important;display:none!important}
.key-gate-logo{font-family:'Bebas Neue',cursive;font-size:52px;letter-spacing:8px;
  color:var(--goal-acc);margin-bottom:4px;line-height:1}
.key-gate-sub{font-size:9px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-bottom:32px}
.key-gate-card{background:rgba(245,238,216,.05);border:1.5px solid rgba(245,238,216,.12);
  border-radius:12px;padding:24px;width:100%;max-width:400px;text-align:left}
.key-gate-title{font-family:'Bebas Neue',cursive;font-size:18px;letter-spacing:2px;
  color:var(--text);margin-bottom:6px}
.key-gate-desc{font-size:10px;color:var(--muted);line-height:1.7;margin-bottom:18px}
.key-gate-desc a{color:var(--goal-hi);text-decoration:none}
.key-gate-input{width:100%;background:rgba(245,238,216,.07);border:1.5px solid rgba(245,238,216,.2);
  border-radius:8px;padding:12px 14px;font-family:'Space Mono',monospace;font-size:11px;
  color:var(--text);outline:none;margin-bottom:6px;letter-spacing:.5px;
  transition:border-color .2s}
.key-gate-input:focus{border-color:var(--goal-acc)}
.key-gate-input::placeholder{color:rgba(245,238,216,.25);letter-spacing:0}
.key-gate-hint{font-size:9px;color:var(--muted);margin-bottom:18px;line-height:1.6}
.key-gate-btn{width:100%;padding:14px;background:var(--goal-acc);border:none;border-radius:8px;
  font-family:'Bebas Neue',cursive;font-size:20px;letter-spacing:2px;color:var(--text);
  cursor:pointer;transition:all .2s var(--ease-spring)}
.key-gate-btn:active{transform:scale(0.97);opacity:.9}
.key-gate-err{font-size:10px;color:var(--red);margin-top:8px;display:none}
/* Settings section inside theme page */
.settings-section{margin-top:28px}
.settings-row{display:flex;align-items:center;gap:12px;background:rgba(245,238,216,.04);
  border:1.5px solid rgba(245,238,216,.1);border-radius:10px;padding:14px;margin-bottom:8px}
.settings-row-info{flex:1;min-width:0}
.settings-row-label{font-size:11px;font-weight:700;color:var(--text);margin-bottom:2px}
.settings-row-desc{font-size:9px;color:var(--muted);line-height:1.5}
.settings-btn{background:rgba(245,238,216,.08);border:1px solid rgba(245,238,216,.2);
  border-radius:6px;padding:7px 12px;font-family:'Space Mono',monospace;font-size:9px;
  font-weight:700;color:var(--muted);cursor:pointer;white-space:nowrap;letter-spacing:.5px;
  text-transform:uppercase;transition:all .2s}
.settings-btn:active{transform:scale(0.95)}
.settings-btn.danger{border-color:rgba(239,68,68,.3);color:var(--red)}
.feedback-cat-btn{background:rgba(245,238,216,.06);border:1px solid rgba(245,238,216,.15);
  border-radius:5px;padding:6px 10px;font-size:11px;font-weight:600;color:var(--muted);
  cursor:pointer;transition:all .2s;white-space:nowrap}
.feedback-cat-btn:hover{background:rgba(245,238,216,.12);border-color:rgba(245,238,216,.25);color:var(--text)}
.feedback-cat-btn:active{transform:scale(0.95)}
.key-dot{display:inline-block;width:7px;height:7px;border-radius:50%;
  background:#4ade80;margin-right:5px;vertical-align:middle}
.key-dot.missing{background:var(--red)}

/* ── DAILY RESOURCE PANEL ────────────────────────────────────────────────── */
.daily-res-card{background:rgba(245,238,216,.05);border:1.5px solid rgba(245,238,216,.12);
  border-left:3px solid var(--goal-acc);border-radius:8px;padding:14px 16px;
  margin-bottom:16px;animation:fadeSlideIn .3s var(--ease-out-quart)}
.daily-res-date{font-size:9px;color:var(--goal-acc);letter-spacing:1.5px;
  text-transform:uppercase;font-weight:700;margin-bottom:8px}
.daily-res-tip{font-size:12px;color:var(--text);line-height:1.65;margin-bottom:12px}
.daily-res-link-wrap{background:rgba(245,238,216,.04);border-radius:6px;padding:10px 12px}
.daily-res-source{font-size:8px;color:var(--muted);letter-spacing:1px;
  text-transform:uppercase;margin-bottom:4px}
.daily-res-link{font-family:'Space Mono',monospace;font-size:11px;font-weight:700;
  color:var(--goal-hi);text-decoration:none;display:block;margin-bottom:4px;line-height:1.4}
.daily-res-desc{font-size:10px;color:var(--muted);line-height:1.5}

/* ── DAY SELECTOR ────────────────────────────────────────────────────────── */
.day-selector-wrap{margin:14px 0 4px}
.day-selector-label{font-size:9px;color:var(--muted);text-transform:uppercase;
  letter-spacing:1px;font-weight:700;margin-bottom:8px}
.day-selector-pills{display:flex;gap:6px;flex-wrap:wrap}
.day-pill{width:38px;height:38px;border-radius:8px;border:1.5px solid rgba(245,238,216,.18);
  background:rgba(245,238,216,.04);display:flex;flex-direction:column;align-items:center;
  justify-content:center;cursor:pointer;transition:all .2s var(--ease-spring);
  font-family:'Space Mono',monospace;font-size:8px;font-weight:700;color:rgba(245,238,216,.45);
  letter-spacing:.5px;text-transform:uppercase;user-select:none;gap:1px}
.day-pill span.day-num{font-family:'Bebas Neue',cursive;font-size:17px;line-height:1;
  color:rgba(245,238,216,.4);transition:color .2s}
.day-pill.selected{background:var(--goal-acc);border-color:var(--goal-acc);
  color:var(--text);transform:scale(1.06)}
.day-pill.selected span.day-num{color:var(--text)}
.day-pill:active{transform:scale(0.93)}

/* coaching feedback block */
.coach-feedback{border-radius:8px;padding:12px 14px;margin-top:12px;
  border-left:3px solid var(--goal-acc);font-size:11px;line-height:1.65;
  background:rgba(245,238,216,.04);transition:all .3s}
.coach-feedback.positive{border-left-color:#4ade80;background:rgba(74,222,128,.06)}
.coach-feedback.caution{border-left-color:var(--amber);background:rgba(244,135,75,.07)}
.coach-feedback .cf-label{font-size:8px;font-weight:700;letter-spacing:1.5px;
  text-transform:uppercase;margin-bottom:5px}
.coach-feedback.positive .cf-label{color:#4ade80}
.coach-feedback.caution .cf-label{color:var(--amber)}
.coach-feedback .cf-text{color:var(--muted)}

/* ── DAILY QUOTE ─────────────────────────────────────────────────────────── */
.qb-cat{font-family:'Bebas Neue',cursive;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:6px;line-height:1}
.qb-text{font-size:13px;font-style:italic;color:var(--text);line-height:1.5;
  margin-bottom:4px}
.qb-attr{font-size:10px;color:var(--muted);letter-spacing:.5px}
.quote-banner{margin:10px 14px 0;padding:14px 16px 12px;
  border-radius:10px;background:rgba(245,238,216,.04);
  border:1.5px solid rgba(245,238,216,.1);border-left:3px solid var(--goal-acc);
  animation:fadeSlideIn .4s var(--ease-out-quart);cursor:pointer;
  transition:border-color .3s,background .3s}
.quote-banner:active{opacity:.8}
.quote-cat{font-size:8px;font-weight:700;letter-spacing:2px;text-transform:uppercase;
  color:var(--goal-acc);margin-bottom:6px;display:flex;align-items:center;gap:5px}
.quote-cat-icon{font-size:11px}
.quote-text{font-size:12px;color:var(--text);line-height:1.65;font-style:italic}
.quote-attr{font-size:9px;color:var(--muted);margin-top:6px;letter-spacing:.5px}
/* Metallic font override */
html[data-theme="metal"] .quote-text{font-family:var(--font-metal);font-style:normal;
  font-size:13px;letter-spacing:1px;line-height:1.5}
html[data-theme="metal"] .qb-cat{font-family:'Bebas Neue',cursive;font-size:11px;letter-spacing:2px;
  text-transform:uppercase;margin-bottom:6px;line-height:1}
.qb-text{font-size:13px;font-style:italic;color:var(--text);line-height:1.5;
  margin-bottom:4px}
.qb-attr{font-size:10px;color:var(--muted);letter-spacing:.5px}
[data-theme="metal"] .quote-banner,[data-theme="blackout"] .quote-banner{border-left-color:var(--metal-acc)}

/* Quote settings in theme/settings tab */
.quote-cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.quote-cat-card{border-radius:8px;border:1.5px solid rgba(245,238,216,.12);
  padding:11px 12px;cursor:pointer;transition:all .2s var(--ease-spring);
  background:rgba(245,238,216,.03);user-select:none;display:flex;gap:9px;align-items:center}
.quote-cat-card:active{transform:scale(0.96)}
.quote-cat-card.active{border-color:var(--goal-acc);background:rgba(245,238,216,.07)}
.quote-cat-card.active .qcc-name{color:var(--goal-hi)}
.qcc-icon{font-size:18px;flex-shrink:0}
.qcc-name{font-size:10px;font-weight:700;color:var(--muted);letter-spacing:.5px;
  text-transform:uppercase;line-height:1.3}
.qcc-count{font-size:8px;color:rgba(245,238,216,.3);margin-top:2px}
.qcc-check{margin-left:auto;font-size:12px;color:var(--goal-acc);
  opacity:0;transition:opacity .2s}
.quote-cat-card.active .qcc-check{opacity:1}

/* ── PLAN MANAGE BUTTON (header) ─────────────────────────────────────────── */
.hd-manage{background:none;border:1px solid rgba(245,238,216,.18);border-radius:6px;
  padding:4px 9px;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;
  color:rgba(245,238,216,.45);letter-spacing:.5px;text-transform:uppercase;cursor:pointer;
  transition:all .2s var(--ease-spring);flex-shrink:0;display:none}
.hd-manage.visible{display:block}
.hd-manage:active{transform:scale(0.92)}

/* ── MANAGE DRAWER ────────────────────────────────────────────────────────── */
.manage-drawer{position:fixed;inset:0;z-index:600;display:flex;
  flex-direction:column;justify-content:flex-end;
  pointer-events:none;visibility:hidden}
.manage-drawer.open{pointer-events:auto;visibility:visible}
.manage-drawer-bg{position:absolute;inset:0;background:rgba(0,0,0,.7)}
.manage-drawer-sheet{position:relative;background:var(--goal-surf);
  border-radius:16px 16px 0 0;padding:20px 18px 32px;
  border-top:3px solid var(--goal-acc);
  transform:translateY(100%);transition:transform .3s var(--ease-out-quart)}
.manage-drawer.open .manage-drawer-sheet{transform:translateY(0)}
.manage-drawer-handle{width:36px;height:4px;border-radius:2px;
  background:rgba(245,238,216,.2);margin:0 auto 18px}
.manage-drawer-title{font-family:'Bebas Neue',cursive;font-size:20px;
  letter-spacing:3px;color:var(--goal-hi);margin-bottom:4px}
.manage-drawer-sub{font-size:9px;color:var(--muted);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:20px}
.manage-prompt-card{background:rgba(245,238,216,.04);border:1px solid rgba(245,238,216,.1);
  border-radius:8px;padding:12px 14px;margin-bottom:14px}
.manage-prompt-label{font-size:8px;color:var(--muted);letter-spacing:1.5px;
  text-transform:uppercase;font-weight:700;margin-bottom:8px}
.manage-prompt-row{display:flex;gap:8px;align-items:flex-start;
  padding:5px 0;border-bottom:1px solid rgba(245,238,216,.06);font-size:10px}
.manage-prompt-row:last-child{border-bottom:none;padding-bottom:0}
.manage-prompt-key{color:var(--muted);min-width:68px;flex-shrink:0;font-size:9px;
  text-transform:uppercase;letter-spacing:.5px;padding-top:1px}
.manage-prompt-val{color:var(--text);line-height:1.5;flex:1}
.manage-prompt-tag{display:inline-block;background:var(--goal-acc);color:var(--text);
  font-size:8px;font-weight:700;padding:1px 6px;border-radius:3px;
  margin:1px 2px 1px 0;letter-spacing:.5px;text-transform:uppercase}
.manage-actions{display:flex;flex-direction:column;gap:8px}
.manage-btn{width:100%;padding:13px;border-radius:8px;border:none;
  font-family:'Space Mono',monospace;font-size:10px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;cursor:pointer;
  transition:all .2s var(--ease-spring);display:flex;align-items:center;
  justify-content:center;gap:8px}
.manage-btn:active{transform:scale(0.97)}
.manage-btn.archive{background:rgba(245,238,216,.07);
  border:1.5px solid rgba(245,238,216,.15);color:var(--muted)}
.manage-btn.danger{background:rgba(239,68,68,.12);
  border:1.5px solid rgba(239,68,68,.3);color:#ef4444}

/* ── VAULT (settings tab) ─────────────────────────────────────────────────── */
.vault-section{margin-top:24px}
.vault-empty{font-size:10px;color:var(--muted);padding:14px 0;
  text-align:center;letter-spacing:.5px}
.vault-card{background:rgba(245,238,216,.04);border:1.5px solid rgba(245,238,216,.1);
  border-radius:10px;padding:14px;margin-bottom:10px}
.vault-card-header{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.vault-btn-ico{display:inline-flex;width:14px;height:14px;align-items:center;justify-content:center;vertical-align:-2px;margin-right:4px}
.vault-btn-ico svg{width:100%;height:100%}
.vault-card-icon{width:20px;height:20px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.vault-card-icon svg{width:100%;height:100%}
.vault-card-name{font-family:'Bebas Neue',cursive;font-size:16px;
  letter-spacing:2px;color:var(--text);line-height:1}
.vault-card-date{font-size:8px;color:var(--muted);letter-spacing:.5px;
  text-transform:uppercase;margin-top:2px}
.vault-card-prompt{background:rgba(245,238,216,.03);border-radius:6px;
  padding:9px 11px;margin-bottom:10px;font-size:10px;color:var(--muted);
  line-height:1.6;border:1px solid rgba(245,238,216,.07)}
.vault-card-actions{display:flex;gap:7px}
.vault-btn{flex:1;padding:9px 6px;border-radius:6px;font-family:'Space Mono',monospace;
  font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
  cursor:pointer;transition:all .18s var(--ease-spring);border:none}
.vault-btn:active{transform:scale(0.94)}
.vault-btn.restore{background:rgba(245,238,216,.08);color:var(--text);
  border:1.5px solid rgba(245,238,216,.15)}
.vault-btn.delete{background:rgba(239,68,68,.1);color:#ef4444;
  border:1.5px solid rgba(239,68,68,.25)}

/* ── QUICK STATUS TOGGLE ─────────────────────────────────────────────────── */
.ex-chk-wrap{position:relative;flex-shrink:0}
.ex-chk{width:28px;height:28px;border-radius:6px;border:2px solid rgba(245,238,216,.25);
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  font-size:13px;transition:all .18s var(--ease-spring);cursor:pointer;
  user-select:none}
.ex-chk:active{transform:scale(0.88)}
.ex-chk.done{background:var(--goal-acc);border-color:var(--goal-acc);color:var(--text)}
.ex-chk.skip{background:rgba(245,238,216,.15);border-color:rgba(245,238,216,.3);
  color:rgba(245,238,216,.6)}

/* ── DRAG AND DROP GOAL TABS ─────────────────────────────────────────────── */
.goal-tab.dragging{opacity:.4;transform:scale(0.95)}
.goal-tab.drag-over{border-color:var(--goal-acc)!important;
  box-shadow:0 0 0 2px var(--goal-acc)}

/* ── PLAN RENAME ─────────────────────────────────────────────────────────── */
.rename-row{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.rename-input{flex:1;background:rgba(245,238,216,.07);border:1.5px solid rgba(245,238,216,.2);
  border-radius:7px;padding:10px 12px;font-family:'Bebas Neue',cursive;font-size:18px;
  letter-spacing:2px;color:var(--text);outline:none;transition:border-color .2s}
.rename-input:focus{border-color:var(--goal-acc)}
.rename-save-btn{background:var(--goal-acc);border:none;border-radius:7px;
  padding:10px 14px;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;color:var(--text);cursor:pointer;
  transition:all .18s var(--ease-spring);white-space:nowrap;flex-shrink:0}
.rename-save-btn:active{transform:scale(0.93)}

/* ── PROGRESS CHARTS ─────────────────────────────────────────────────────── */
.chart-card{background:rgba(245,238,216,.03);border:1.5px solid rgba(245,238,216,.1);
  border-radius:8px;padding:14px;margin-bottom:10px}
.chart-title{font-family:'Bebas Neue',cursive;font-size:15px;letter-spacing:3px;
  color:var(--goal-hi);margin-bottom:4px}
.chart-sub{font-size:9px;color:var(--muted);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:14px}

/* Week-over-week bar chart */
.wow-chart{display:flex;align-items:flex-end;gap:4px;height:80px;
  padding:0 2px;margin-bottom:8px}
.wow-bar-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;
  height:100%;justify-content:flex-end}
.wow-bar{width:100%;border-radius:3px 3px 0 0;transition:height .4s var(--ease-out-quart);
  min-height:2px;position:relative}
.wow-bar.current{outline:2px solid var(--goal-acc);outline-offset:1px}
.wow-bar.empty{background:rgba(245,238,216,.06)}
.wow-bar.has-data{background:var(--goal-acc);opacity:.7}
.wow-bar.has-data.current{opacity:1}
.wow-bar.full{background:var(--goal-hi);opacity:1}
.wow-lbl{font-size:7px;color:rgba(245,238,216,.3);letter-spacing:.3px;text-align:center}
.wow-lbl.current{color:var(--goal-acc);font-weight:700}
.wow-pct{position:absolute;top:-14px;left:50%;transform:translateX(-50%);
  font-size:7px;color:var(--goal-acc);font-weight:700;white-space:nowrap;
  opacity:0;transition:opacity .2s}
.wow-bar.current .wow-pct{opacity:1}

/* Day breakdown bars */
.day-bars{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:6px}
.day-bar-col{display:flex;flex-direction:column;align-items:center;gap:3px}
.day-bar-track{width:100%;height:36px;background:rgba(245,238,216,.06);
  border-radius:3px;overflow:hidden;display:flex;flex-direction:column;
  justify-content:flex-end}
.day-bar-fill{width:100%;border-radius:2px;transition:height .35s var(--ease-out-quart)}
.day-bar-fill.done{background:var(--goal-acc)}
.day-bar-fill.partial{background:var(--amber)}
.day-bar-fill.rest{background:rgba(245,238,216,.12)}
.day-bar-name{font-size:7px;color:rgba(245,238,216,.35);letter-spacing:.3px;
  text-align:center;text-transform:uppercase}
.day-bar-name.done{color:var(--goal-acc)}
.day-bar-name.partial{color:var(--amber)}

/* Streak + personal best row */
.streak-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
.streak-box{background:rgba(245,238,216,.04);border:1.5px solid rgba(245,238,216,.08);
  border-radius:8px;padding:10px;text-align:center}
.streak-num{font-family:'Bebas Neue',cursive;font-size:26px;letter-spacing:2px;
  color:var(--goal-acc);line-height:1}
.streak-lbl{font-size:8px;color:var(--muted);text-transform:uppercase;
  letter-spacing:.8px;margin-top:2px}
.streak-box.highlight{border-color:rgba(245,238,216,.2);background:rgba(245,238,216,.06)}
.streak-box.highlight .streak-num{color:var(--goal-hi)}

/* Heatmap (12-week grid) */
.heatmap{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-bottom:6px}
.hm-cell{aspect-ratio:1;border-radius:2px;transition:transform .15s}
.hm-cell:active{transform:scale(0.85)}
.hm-cell.empty{background:rgba(245,238,216,.05)}
.hm-cell.low{background:rgba(var(--goal-acc-rgb,212,82,10),.3)}
.hm-cell.mid{background:rgba(var(--goal-acc-rgb,212,82,10),.6)}
.hm-cell.high{background:var(--goal-acc);opacity:.85}
.hm-cell.full{background:var(--goal-hi)}
.hm-cell.current-wk{outline:1.5px solid var(--goal-acc);outline-offset:1px}
.hm-labels{display:grid;grid-template-columns:repeat(12,1fr);gap:3px;margin-bottom:10px}
.hm-lbl{font-size:7px;color:rgba(245,238,216,.25);text-align:center;letter-spacing:0}
.hm-lbl.active{color:var(--goal-acc)}

html[data-theme="metal"] .wow-bar.has-data{background:var(--metal-acc)}
html[data-theme="metal"] .streak-num{color:var(--metal-acc)}

/* ── SHARE / EXPORT ──────────────────────────────────────────────────────── */
.manage-btn.share{background:rgba(245,238,216,.07);
  border:1.5px solid rgba(245,238,216,.15);color:var(--text)}
.share-modal{position:fixed;inset:0;z-index:700;display:flex;align-items:flex-end;
  justify-content:center;pointer-events:none;visibility:hidden}
.share-modal.open{pointer-events:auto;visibility:visible}
.share-modal-bg{position:absolute;inset:0;background:rgba(0,0,0,.8)}
.share-modal-sheet{position:relative;width:100%;max-width:480px;
  background:var(--goal-surf);border-radius:16px 16px 0 0;
  border-top:3px solid var(--goal-acc);padding:20px 18px 36px;
  transform:translateY(100%);transition:transform .3s var(--ease-out-quart)}
.share-modal.open .share-modal-sheet{transform:translateY(0)}
.share-modal-handle{width:36px;height:4px;border-radius:2px;
  background:rgba(245,238,216,.2);margin:0 auto 18px}
.share-modal-title{font-family:'Bebas Neue',cursive;font-size:20px;
  letter-spacing:3px;color:var(--goal-hi);margin-bottom:4px}
.share-modal-sub{font-size:9px;color:var(--muted);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:18px}
.share-options{display:flex;flex-direction:column;gap:10px}
.share-opt{display:flex;align-items:center;gap:14px;
  background:rgba(245,238,216,.04);border:1.5px solid rgba(245,238,216,.1);
  border-radius:10px;padding:14px;cursor:pointer;
  transition:all .18s var(--ease-spring);user-select:none}
.share-opt:active{transform:scale(0.97);background:rgba(245,238,216,.08)}
.share-opt-icon{font-size:24px;flex-shrink:0}
.share-opt-info{flex:1}
.share-opt-name{font-size:12px;font-weight:700;color:var(--text);
  letter-spacing:.3px;margin-bottom:2px}
.share-opt-desc{font-size:10px;color:var(--muted);line-height:1.4}
.share-opt-arrow{font-size:16px;color:var(--muted);flex-shrink:0}

/* Plan card preview (shown before download) */
.plan-card-preview{background:var(--goal-bg);border:1.5px solid var(--goal-acc);
  border-radius:12px;padding:20px;margin-bottom:14px;text-align:center;
  font-family:'Bebas Neue',cursive}
.pcp-badge{font-size:11px;letter-spacing:3px;color:var(--goal-acc);margin-bottom:6px}
.pcp-name{font-size:28px;letter-spacing:4px;color:var(--text);margin-bottom:8px;line-height:1.1}
.pcp-tags{display:flex;flex-wrap:wrap;justify-content:center;gap:5px;margin-bottom:10px}
.pcp-tag{background:var(--goal-acc);color:var(--text);font-size:8px;font-weight:700;
  padding:2px 8px;border-radius:3px;letter-spacing:.5px;text-transform:uppercase;
  font-family:'Space Mono',monospace}
.pcp-split{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:8px}
.pcp-footer{font-size:9px;color:rgba(245,238,216,.3);letter-spacing:2px;margin-top:10px}

/* ── NOTIFICATION SETTINGS ───────────────────────────────────────────────── */
.notif-section{margin-top:0}
.notif-perm-banner{border-radius:10px;padding:14px;margin-bottom:10px;
  background:rgba(245,238,216,.05);border:1.5px solid rgba(245,238,216,.12);
  display:flex;align-items:center;gap:12px}
.notif-perm-icon{font-size:24px;flex-shrink:0}
.notif-perm-info{flex:1}
.notif-perm-title{font-size:11px;font-weight:700;color:var(--text);margin-bottom:3px}
.notif-perm-desc{font-size:9px;color:var(--muted);line-height:1.6}
.notif-perm-btn{flex-shrink:0;background:var(--goal-acc);border:none;border-radius:7px;
  padding:9px 14px;font-family:'Space Mono',monospace;font-size:9px;font-weight:700;
  color:var(--text);cursor:pointer;letter-spacing:.5px;text-transform:uppercase;
  transition:all .18s var(--ease-spring)}
.notif-perm-btn:active{transform:scale(0.94)}
.notif-perm-btn.granted{background:rgba(74,222,128,.15);color:#4ade80;
  border:1.5px solid rgba(74,222,128,.3);cursor:default}
.notif-perm-btn.denied{background:rgba(239,68,68,.1);color:#ef4444;
  border:1.5px solid rgba(239,68,68,.2);cursor:default}

/* Toggle rows */
.notif-row{display:flex;align-items:center;gap:12px;padding:11px 0;
  border-bottom:1px solid rgba(245,238,216,.07)}
.notif-row:last-child{border-bottom:none}
.notif-row-info{flex:1;min-width:0}
.notif-row-label{font-size:11px;font-weight:700;color:var(--text);margin-bottom:2px}
.notif-row-desc{font-size:9px;color:var(--muted);line-height:1.5}
.notif-toggle{position:relative;width:44px;height:24px;flex-shrink:0}
.notif-toggle input{opacity:0;width:0;height:0;position:absolute}
.notif-slider{position:absolute;inset:0;background:rgba(245,238,216,.15);
  border-radius:12px;cursor:pointer;transition:background .2s}
.notif-slider:before{content:'';position:absolute;width:18px;height:18px;
  border-radius:50%;background:#fff;top:3px;left:3px;
  transition:transform .2s var(--ease-spring)}
.notif-toggle input:checked + .notif-slider{background:var(--goal-acc)}
.notif-toggle input:checked + .notif-slider:before{transform:translateX(20px)}

/* Time picker row */
.notif-time-row{display:flex;align-items:center;gap:10px;padding:10px 0;
  border-bottom:1px solid rgba(245,238,216,.07)}
.notif-time-input{background:rgba(245,238,216,.07);border:1.5px solid rgba(245,238,216,.15);
  border-radius:7px;padding:7px 10px;font-family:'Space Mono',monospace;font-size:11px;
  color:var(--text);width:90px;text-align:center;outline:none;
  transition:border-color .2s}
.notif-time-input:focus{border-color:var(--goal-acc)}

/* In-app notification toast */
.apex-toast{position:fixed;top:0;left:50%;transform:translateX(-50%) translateY(-100%);
  z-index:9999;background:var(--goal-surf);border:1.5px solid var(--goal-acc);
  border-radius:0 0 12px 12px;padding:12px 20px 14px;max-width:400px;width:90%;
  text-align:center;transition:transform .35s var(--ease-out-quart);
  box-shadow:0 8px 32px rgba(0,0,0,.5)}
.apex-toast.show{transform:translateX(-50%) translateY(0)}
.apex-toast-title{font-family:'Bebas Neue',cursive;font-size:16px;letter-spacing:2px;
  color:var(--goal-acc);margin-bottom:4px}
.apex-toast-body{font-size:11px;color:var(--text);line-height:1.5}

/* ── DEFAULT PLAN ─────────────────────────────────────────────────────────── */
.manage-btn.default-plan{background:rgba(212,175,55,.1);
  border:1.5px solid rgba(212,175,55,.3);color:#d4af37}
.manage-btn.default-plan.is-default{background:rgba(212,175,55,.2);
  border-color:rgba(212,175,55,.6);color:#f0d060}
.goal-tab .default-star svg{width:100%;height:100%;fill:currentColor;stroke:none}
.default-star{display:inline-flex;width:11px;height:11px;vertical-align:-2px;margin-left:3px;opacity:0.85;color:var(--goal-acc)}

/* ── ONBOARDING / CHECK-IN / INJURIES ─────────────────────────────────────── */
.onboard-modal{position:fixed;inset:0;z-index:1000;
  background:rgba(0,0,0,.96);display:flex;align-items:center;justify-content:center;
  padding:20px;opacity:0;pointer-events:none;transition:opacity .3s}
.onboard-modal.open{opacity:1;pointer-events:auto}
.onboard-box{background:var(--goal-bg);border:1.5px solid var(--goal-acc);
  border-radius:12px;padding:24px 20px;width:100%;max-width:440px;
  max-height:90vh;overflow-y:auto;text-align:center}
.onboard-step{display:none}
.onboard-step.active{display:block;animation:fadeIn .35s var(--ease-out-quart)}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.onboard-icon svg{width:100%;height:100%;stroke:currentColor}
.onboard-icon{width:52px;height:52px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;color:var(--goal-acc)}
.onboard-title{font-family:'Bebas Neue',cursive;font-size:24px;
  letter-spacing:3px;color:var(--goal-acc);margin-bottom:6px;line-height:1.1}
.onboard-sub{font-size:11px;color:var(--muted);letter-spacing:.5px;
  margin-bottom:20px;line-height:1.6}
.onboard-progress{display:flex;justify-content:center;gap:6px;margin-bottom:18px}
.onboard-dot{width:6px;height:6px;border-radius:50%;background:rgba(245,238,216,.15);
  transition:all .25s}
.onboard-dot.active{background:var(--goal-acc);width:18px;border-radius:3px}

/* Level / gender selector pills */
.onboard-pills{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.onboard-pill{background:rgba(245,238,216,.05);
  border:1.5px solid rgba(245,238,216,.15);border-radius:8px;
  padding:12px 14px;cursor:pointer;transition:all .18s var(--ease-spring);
  text-align:left;display:flex;align-items:center;gap:10px}
.onboard-pill:active{transform:scale(0.97)}
.onboard-pill.selected{background:rgba(var(--goal-acc-rgb,212,82,10),.15);
  border-color:var(--goal-acc)}
.onboard-pill-icon{font-size:20px;flex-shrink:0}
.onboard-pill-body{flex:1;min-width:0}
.onboard-pill-title{font-size:12px;font-weight:700;color:var(--text);
  letter-spacing:.3px;margin-bottom:1px}
.onboard-pill-desc{font-size:10px;color:var(--muted);line-height:1.4}

/* Injury chip grid */
.injury-chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 14px;
  justify-content:center}
.injury-chip{background:rgba(245,238,216,.05);
  border:1.5px solid rgba(245,238,216,.15);border-radius:20px;
  padding:6px 12px;font-size:10px;color:var(--muted);cursor:pointer;
  transition:all .18s var(--ease-spring);font-weight:700;letter-spacing:.5px;
  text-transform:uppercase;user-select:none}
.injury-chip:active{transform:scale(0.9)}
.injury-chip.selected{background:rgba(239,68,68,.15);border-color:#ef4444;
  color:#ef4444}
.injury-textarea{width:100%;background:rgba(245,238,216,.04);
  border:1.5px solid rgba(245,238,216,.15);border-radius:6px;padding:10px 12px;
  font-family:'Space Mono',monospace;font-size:11px;color:var(--text);
  resize:vertical;min-height:60px;outline:none;margin-bottom:14px;
  transition:border-color .2s}
.injury-textarea:focus{border-color:var(--goal-acc)}

/* Onboarding buttons */
.onboard-btns{display:flex;gap:8px;margin-top:4px}
.onboard-btn{flex:1;background:var(--goal-acc);border:none;border-radius:7px;
  padding:13px;font-family:'Bebas Neue',cursive;font-size:14px;
  letter-spacing:2px;color:var(--text);cursor:pointer;font-weight:700;
  transition:all .2s var(--ease-spring);text-transform:uppercase}
.onboard-btn:active{transform:scale(0.97);opacity:.85}
.onboard-btn.secondary{background:transparent;
  border:1.5px solid rgba(245,238,216,.2);color:var(--muted)}
.onboard-btn.skip{background:transparent;color:var(--muted);
  font-size:10px;letter-spacing:1px;padding:8px;margin-top:8px;width:100%}

/* Daily check-in specifics */
.checkin-feeling-pills{display:grid;grid-template-columns:repeat(2,1fr);
  gap:8px;margin-bottom:10px}
.checkin-feeling{background:rgba(245,238,216,.05);
  border:1.5px solid rgba(245,238,216,.15);border-radius:8px;
  padding:14px 10px;cursor:pointer;transition:all .18s var(--ease-spring);
  text-align:center}
.checkin-feeling:active{transform:scale(0.95)}
.checkin-feeling.selected{border-color:var(--goal-acc);
  background:rgba(var(--goal-acc-rgb,212,82,10),.12)}
.checkin-feeling.severe.selected{border-color:#ef4444;
  background:rgba(239,68,68,.1)}
.checkin-feeling-emoji{font-size:24px;margin-bottom:4px}
.checkin-feeling-lbl{font-size:10px;font-weight:700;color:var(--text);
  letter-spacing:.5px;text-transform:uppercase}

/* Return-to-original banner */
.modified-banner{background:rgba(244,135,75,.12);
  border:1.5px solid rgba(244,135,75,.35);border-radius:7px;padding:10px 12px;
  margin:0 14px 10px;display:flex;align-items:center;gap:10px;
  font-size:10px}
.modified-banner-icon{font-size:16px;flex-shrink:0}
.modified-banner-txt{flex:1;color:var(--goal-hi);letter-spacing:.3px;line-height:1.5}
.modified-banner-txt strong{color:var(--text);font-weight:700}
.modified-banner-btn{background:var(--goal-acc);border:none;border-radius:5px;
  padding:6px 10px;font-size:9px;font-weight:700;color:var(--text);
  letter-spacing:.5px;text-transform:uppercase;cursor:pointer;flex-shrink:0;
  font-family:'Space Mono',monospace}
.modified-banner-btn:active{transform:scale(0.94)}

/* Injury history list (in settings) */
.injury-list{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.injury-item{display:flex;align-items:center;gap:10px;
  background:rgba(239,68,68,.07);border:1.5px solid rgba(239,68,68,.2);
  border-radius:7px;padding:9px 12px}
.injury-item-icon{font-size:14px;flex-shrink:0;color:#ef4444}
.injury-item-txt{flex:1;font-size:11px;color:var(--text);
  line-height:1.4}
.injury-item-remove{background:transparent;border:none;color:rgba(239,68,68,.7);
  font-size:18px;cursor:pointer;width:24px;height:24px;border-radius:4px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:all .15s}
.injury-item-remove:active{background:rgba(239,68,68,.2);transform:scale(0.88)}
.injury-empty{font-size:10px;color:var(--muted);text-align:center;padding:10px;
  font-style:italic}
.injury-add-btn{background:rgba(245,238,216,.05);
  border:1.5px dashed rgba(245,238,216,.2);color:var(--muted);
  border-radius:7px;padding:10px;font-family:'Space Mono',monospace;
  font-size:10px;letter-spacing:.5px;width:100%;cursor:pointer;
  text-transform:uppercase;font-weight:700;transition:all .2s}
.injury-add-btn:active{transform:scale(0.97)}
.injury-add-btn:hover{border-color:var(--goal-acc);color:var(--goal-acc)}

/* Profile summary in settings */
.profile-summary{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 10px}
.profile-tag{background:rgba(245,238,216,.07);
  border:1px solid rgba(245,238,216,.15);border-radius:4px;padding:3px 8px;
  font-size:9px;color:var(--muted);letter-spacing:.3px;text-transform:uppercase;
  font-weight:700}
.profile-tag.accent{background:rgba(var(--goal-acc-rgb,212,82,10),.15);
  border-color:var(--goal-acc);color:var(--goal-acc)}

/* ── FEATURE STATUS ──────────────────────────────────────────────────────── */
.feature-status{margin-bottom:14px}
.feature-status-hdr{font-size:10px;color:var(--muted);letter-spacing:1px;
  text-transform:uppercase;margin-bottom:6px;font-weight:700}
.feature-row{display:flex;align-items:center;gap:10px;padding:8px 10px;
  background:rgba(245,238,216,.04);border:1px solid rgba(245,238,216,.08);
  border-radius:6px;margin-bottom:4px}
.feature-row.active{background:rgba(74,222,128,.06);border-color:rgba(74,222,128,.2)}
.feature-row.locked{background:rgba(245,238,216,.03);border-color:rgba(245,238,216,.1);
  opacity:.7}
.feature-icon-status{font-size:12px;flex-shrink:0;width:18px;text-align:center}
.feature-name{flex:1;font-size:10px;color:var(--text);letter-spacing:.3px;
  line-height:1.3}
.feature-tag{font-size:8px;padding:2px 6px;border-radius:3px;font-weight:700;
  letter-spacing:.5px;text-transform:uppercase;flex-shrink:0;font-family:'Space Mono',monospace}
.feature-tag.active{background:rgba(74,222,128,.15);color:#4ade80}
.feature-tag.locked{background:rgba(245,238,216,.06);color:var(--muted)}
.feature-status-cta{margin-top:10px;padding:10px 12px;
  background:rgba(var(--goal-acc-rgb,212,82,10),.08);
  border:1.5px solid rgba(var(--goal-acc-rgb,212,82,10),.3);
  border-radius:7px;display:flex;align-items:center;gap:10px;font-size:10px;
  color:var(--text)}
.feature-status-cta-icon{font-size:14px;flex-shrink:0}
.feature-status-cta-txt{flex:1;line-height:1.5}
.feature-status-cta-txt strong{color:var(--goal-acc)}

/* ── OFF ROAD THEME — Satisfy-inspired: bone white, espresso, trail leather ── */
/* Uses actual app class names — verified against HTML structure */

/* ── Document root ── */
[data-theme="offroad"]{
  color:#1a1612;
  /* Override all CSS vars to light/cream scheme */
  --text:#1a1612;
  --muted:#7a6f65;
  --hi:#2a2420;
  --bg:#f0ebe3;
  --surf:#e8e1d8;
  --mid:#c8bfb0;
  --border:rgba(42,36,32,.12);
  --black:#f0ebe3;
  /* Goal colors — espresso accent on cream */
  --goal-bg:#f0ebe3;
  --goal-surf:#e8e1d8;
  --goal-mid:#c8bfb0;
  --goal-acc:#2a2420;
  --goal-hi:#6b5c4e;
  /* Progress bar */
  --pb-fill:#2a2420;
  --amber:#8a6a20}

/* ── Goal/plan tab bar ── */
[data-theme="offroad"] .goal-bar{
  background:#e8e1d8;
  border-bottom-color:rgba(42,36,32,.12)}
[data-theme="offroad"] .goal-tab{
  color:rgba(42,36,32,.4)}
[data-theme="offroad"] .goal-tab.active{
  opacity:1;border-bottom-color:#2a2420;
  background:rgba(42,36,32,.06)}
[data-theme="offroad"] .goal-tab .gt-label{color:rgba(42,36,32,.7)}
[data-theme="offroad"] .goal-tab.active .gt-label{color:#1a1612}
[data-theme="offroad"] .goal-add-btn{
  border-color:rgba(42,36,32,.25);color:rgba(42,36,32,.5)}
[data-theme="offroad"] .goal-add-btn:hover{
  border-color:#2a2420;color:#2a2420}

/* ── App header ── */
[data-theme="offroad"] .app-hd{
  background:#f0ebe3;
  border-bottom-color:#2a2420}
[data-theme="offroad"] .app-hd h1{color:#1a1612}
[data-theme="offroad"] .app-hd #hd-sub{color:#7a6f65}
[data-theme="offroad"] .hd-pct{color:#6b5c4e}
[data-theme="offroad"] .hd-manage{color:#6b5c4e}
[data-theme="offroad"] .hd-manage:hover{background:rgba(42,36,32,.08)}
[data-theme="offroad"] .hd-badge{background:#2a2420;color:#f0ebe3}

/* ── Week bar ── */

  background:#e6dfd5;
  border-bottom-color:rgba(42,36,32,.1)}
[data-theme="offroad"] .week-btn{

[data-theme="offroad"] .week-btn.active{
  background:#2a2420;color:#f0ebe3;border-color:#2a2420}

/* ── Day nav tabs ── */

/* ── Page background ── */

[data-theme="offroad"] .pg-body,
[data-theme="offroad"] .pg-res,

/* ── Day header card ── */

/* ── Exercise rows ── */

[data-theme="offroad"] .settings-row-desc{color:#7a6f65}

/* ── Manage drawer ── */

[data-theme="offroad"] .manage-drawer-handle{background:rgba(42,36,32,.2)}

[data-theme="offroad"] .manage-drawer-sub{color:#7a6f65}
[data-theme="offroad"] .manage-btn{
  background:rgba(42,36,32,.05);
  border-color:rgba(42,36,32,.12);color:#1a1612}
[data-theme="offroad"] .manage-btn:hover{border-color:#2a2420}

[data-theme="offroad"] .onboard-box{
  background:#f0ebe3;border-color:#2a2420}

[data-theme="offroad"] .onboard-sub{color:#7a6f65}
[data-theme="offroad"] .onboard-pill{

  border-color:rgba(42,36,32,.12)}

[data-theme="offroad"] .onboard-pill.selected{
  background:rgba(42,36,32,.1);border-color:#2a2420}
[data-theme="offroad"] .onboard-pill-title{color:#1a1612}
[data-theme="offroad"] .onboard-pill-desc{color:#7a6f65}
[data-theme="offroad"] .onboard-btn{background:#2a2420;color:#f0ebe3}
[data-theme="offroad"] .onboard-btn.secondary{
  border-color:rgba(42,36,32,.2);color:#1a1612;background:transparent}
[data-theme="offroad"] .injury-chip{
  background:rgba(42,36,32,.04);
  border-color:rgba(42,36,32,.12);color:#6b5c4e}
[data-theme="offroad"] .injury-chip.selected{
  background:rgba(239,68,68,.08);
  border-color:#ef4444;color:#dc2626}
[data-theme="offroad"] .injury-item{
  background:rgba(239,68,68,.05);
  border-color:rgba(239,68,68,.15)}
[data-theme="offroad"] .injury-textarea{
  background:rgba(42,36,32,.04);
  border-color:rgba(42,36,32,.15);color:#1a1612}

/* ── Toast ── */
[data-theme="offroad"] .apex-toast{
  background:#2a2420;color:#f0ebe3}
[data-theme="offroad"] .apex-toast-body{color:rgba(240,235,227,.8)}

/* ── Feature status ── */
[data-theme="offroad"] .feature-row{
  background:rgba(42,36,32,.04);
  border-color:rgba(42,36,32,.1)}
[data-theme="offroad"] .feature-row.active{
  background:rgba(74,222,128,.05);
  border-color:rgba(74,222,128,.2)}
[data-theme="offroad"] .feature-name{color:#1a1612}
[data-theme="offroad"] .feature-status-cta{
  background:rgba(42,36,32,.05);
  border-color:rgba(42,36,32,.2)}

/* ── Trial gate ── */
.trial-gate{
  position:fixed;inset:0;z-index:9000;overflow-y:auto;
  display:none;
  align-items:flex-start;justify-content:center;
  padding:40px 20px 60px;

  background: var(--start-acc);

  background: var(--start-hi);
}

body[data-theme="start"] .toast {
  background: var(--start-surf);
  border-color: var(--start-acc);
  color: var(--start-text);
}

body[data-theme="start"] input,
body[data-theme="start"] textarea {
  background: var(--start-mid);
  color: var(--start-text);
  border-color: var(--start-mid);
}

  background: var(--start-surf);

  color: var(--start-acc);
}

  color: var(--start-hi);

/* Dividers and borders */
